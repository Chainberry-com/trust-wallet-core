name: CI

on:
  push:
    branches: [main, audit]
  pull_request:
    branches: [main, audit]

jobs:
  # Android: compile check + unit tests (no device required).
  # Instrumented tests (connectedDebugAndroidTest) require a real device or emulator — run locally.
  android-build:
    name: Android build
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

  android-unit-test:
    name: Android unit tests
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run unit tests
        working-directory: android
        run: ./gradlew test

  # iOS: pod spec lint + swift syntax check.
  # A full Xcode build requires the parent Expo project (vault.xcworkspace) — run locally via
  # `expo run:ios --no-install` after `pod install` in the parent project.
  ios-podspec-lint:
    name: iOS podspec lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Lint podspec
        run: |
          LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 \
          pod spec lint TrustWalletCoreModule.podspec \
            --allow-warnings \
            --skip-import-validation
